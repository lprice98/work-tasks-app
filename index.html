<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Work Tasks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div id="app-title">Work Tasks</div>
      <ul id="tabs">
        <li class="tab active" data-category="today">Today</li>
        <li class="tab" data-category="thisweek">This Week</li>
        <li class="tab" data-category="backlog">Backlog</li>
      </ul>
    </nav>

    <main id="content">
      <div id="task-area">
        <div id="active-tasks"></div>
        <div id="completed-section" class="hidden">
          <button id="completed-toggle">▶ Completed (<span id="completed-count">0</span>)</button>
          <div id="completed-tasks" class="hidden"></div>
        </div>
      </div>

      <div id="add-bar">
        <button id="add-btn">+ Add Task</button>
      </div>

      <div id="form-panel" class="hidden">
        <h2 id="form-title">New Task</h2>
        <label>Title<input type="text" id="f-title" placeholder="Task title"></label>
        <label>Category
          <select id="f-category">
            <option value="today">Today</option>
            <option value="thisweek">This Week</option>
            <option value="backlog">Backlog</option>
          </select>
        </label>
        <label>Priority
          <select id="f-priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label>Due Date<input type="date" id="f-due"></label>
        <label>Notes<textarea id="f-notes" rows="3" placeholder="Optional notes"></textarea></label>
        <div id="form-actions">
          <button id="form-cancel">Cancel</button>
          <button id="form-save">Save</button>
        </div>
      </div>
    </main>
  </div>

  <script src="src/tasks.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
